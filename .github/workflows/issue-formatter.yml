name: Claude Issue Formatter

on:
  issues:
    types: [opened, edited]

jobs:
  format-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Format issue with Claude
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Bash(gh*)"
          prompt: |
            Eres un formateador de issues de GitHub para un proyecto de Tetris (vanilla JS/HTML/CSS, sin dependencias).

            Un issue fue ${{ github.event.action }} con los siguientes detalles:
            - Número de issue: #${{ github.event.issue.number }}
            - Título: ${{ github.event.issue.title }}
            - Cuerpo: ${{ github.event.issue.body }}
            - Autor: ${{ github.event.issue.user.login }}

            Los templates disponibles son:

            **Bug Report** (cuando algo no funciona correctamente):
            ```
            ## Resumen
            <!-- Descripción clara y concisa del bug. -->

            ## Pasos para Reproducir
            1. Abrir `index.html` en un navegador
            2. <!-- siguiente paso -->
            3. <!-- siguiente paso -->

            ## Comportamiento Esperado
            <!-- Qué debería ocurrir. -->

            ## Comportamiento Actual
            <!-- Qué ocurre realmente. Incluir errores de consola del navegador si los hay. -->

            ## Contexto Adicional
            <!-- Navegador, versión de SO, capturas de pantalla u otros detalles relevantes. -->
            ```

            **Feature Request** (cuando se solicita una mejora o nueva funcionalidad):
            ```
            ## Resumen
            <!-- Descripción concisa de la funcionalidad deseada. -->

            ## Motivación
            <!-- ¿Por qué sería útil? ¿Qué problema resuelve? -->

            ## Enfoque Propuesto
            <!-- Opcional: cómo podría implementarse, si tienes ideas. -->

            ## Contexto Adicional
            <!-- Enlaces, referencias, mockups o issues relacionados. -->
            ```

            Tus tareas:
            1. **Agrega etiquetas** según el contenido del issue. Usa solo estas etiquetas:
               - `bug` — algo está roto o funciona incorrectamente
               - `enhancement` — solicitud de nueva funcionalidad o mejora
               - `question` — pregunta o solicitud de aclaración
               - `documentation` — la documentación necesita actualización
               - `good first issue` — tarea simple, amigable para principiantes
               - `duplicate` — parece un problema conocido o repetido

            2. **Publica un comentario** en el issue con el siguiente formato en Markdown, completamente en español:
               - Una bienvenida breve y amigable al contribuidor (1-2 oraciones)
               - La sección **"Reporte Formateado"** usando el template correspondiente según el tipo de issue detectado (Bug Report o Feature Request). Completa cada sección con la información del issue o indica qué información falta que el usuario debe proporcionar.
               - Las etiquetas aplicadas con una breve justificación
               - Una nota de cierre agradeciendo al contribuidor

            Usa el CLI `gh` para aplicar etiquetas y publicar el comentario. Comandos de ejemplo:
              gh issue edit ${{ github.event.issue.number }} --add-label "bug" --repo ${{ github.repository }}
              gh issue comment ${{ github.event.issue.number }} --body "..." --repo ${{ github.repository }}

            Sé conciso, útil y amigable. No sobre-compliques la respuesta.