name: Issue Formatter

on:
  issues:
    types: [opened, edited]

jobs:
  format-issue:
    # Skip if already labeled 'formatted' to prevent infinite re-formatting loops.
    # Also skip if the issue was edited by the bot itself.
    if: |
      !contains(github.event.issue.labels.*.name, 'formatted') &&
      github.event.issue.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Format issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Bash(gh issue *)"
          prompt: |
            You are a helpful assistant that improves the readability of GitHub issues
            for a vanilla JavaScript Tetris project. Your task is to post a well-structured
            Markdown comment on the following issue so that multiple collaborators can
            analyze it clearly.

            Issue Number: ${{ github.event.issue.number }}
            Issue Title: ${{ github.event.issue.title }}
            Author: ${{ github.event.issue.user.login }}
            Repository: ${{ github.repository }}

            Current Issue Body:
            ```
            ${{ github.event.issue.body }}
            ```

            Instructions:
            1. Build a properly formatted Markdown document using ONLY the sections that
               have corresponding content in the original body. Use this structure:

               ---
               > 📋 **Formatted version** — auto-generated for readability

               ## Summary
               A concise 1–2 sentence description of the issue.

               ## Steps to Reproduce
               *(Include only for bug reports. Use a numbered list.)*
               1. Step one
               2. Step two

               ## Expected Behavior
               *(Include only for bug reports.)*
               What should happen.

               ## Actual Behavior
               *(Include only for bug reports.)*
               What actually happens. Wrap any error messages in a code block:
               ```
               error message here
               ```

               ## Additional Context
               *(Include only if extra relevant information exists.)*
               Any links, environment details, browser/OS version, or screenshots.

               ---
               *Auto-formatted by [Issue Formatter](.github/workflows/issue-formatter.yml)*

            2. Formatting rules:
               - Use `##` for section headings (H2)
               - Use numbered lists (`1.`, `2.`, …) for steps
               - Use ` ``` ` fenced code blocks for error messages or code snippets
               - Use `> blockquote` for the header callout at the top
               - Preserve the author's original meaning — do not add or remove information

            3. Post this document as a NEW COMMENT on the issue:
               gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "PASTE_THE_FULL_MARKDOWN_HERE"

            4. Then add the label so the issue is not processed again:
               a. Create label if missing (--force is idempotent):
                  gh label create "formatted" --repo ${{ github.repository }} --color "0075ca" --description "Issue body has been auto-formatted for readability" --force
               b. Add label to the issue:
                  gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "formatted"
