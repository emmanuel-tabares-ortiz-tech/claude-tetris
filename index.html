<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
  </script>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar a modo claro" title="Cambiar tema">☀️</button>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <div class="skin-picker">
            <button class="skin-btn" data-skin="retro" title="Retro">Retro</button>
            <button class="skin-btn" data-skin="neon" title="Neon">Neon</button>
            <button class="skin-btn" data-skin="pastel" title="Pastel">Pastel</button>
            <button class="skin-btn" data-skin="pixel" title="Pixel Art">Pixel</button>
          </div>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-stats" class="hidden"></p>

        <div id="name-entry" class="hidden">
          <p class="name-prompt">¡Nueva marca! Escribe tu nombre:</p>
          <div class="name-input-row">
            <input type="text" id="player-name" maxlength="10" placeholder="Jugador"
                   autocomplete="off" spellcheck="false" />
            <button id="save-score-btn">Guardar</button>
          </div>
        </div>

        <div id="scores-section" class="hidden">
          <p class="label">RECORDS</p>
          <table id="scores-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Score</th><th>Combo</th><th>Líneas</th></tr>
            </thead>
            <tbody></tbody>
          </table>
          <button id="reset-scores-btn">Borrar récords</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div class="pause-box">
        <p class="pause-title">PAUSA</p>
        <div class="pause-menu">
          <button id="resume-btn" class="menu-btn">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
          <button id="controls-toggle-btn" class="menu-btn menu-btn--secondary">Ver controles</button>
          <div id="pause-controls" class="pause-controls hidden">
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar suave</li>
              <li><kbd>Space</kbd> caída rápida</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            </ul>
          </div>
          <div class="level-row">
            <label for="start-level">Nivel inicial</label>
            <select id="start-level"></select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
